name: Refresh ledger

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.57.0
      - name: Render ledger
        working-directory: scripts
        env:
          # LEDGER_TOKEN (a PAT with read:user) also counts private contributions; GITHUB_TOKEN sees public only.
          GH_TOKEN: ${{ secrets.LEDGER_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python ledger.py && python stamp.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ledger.svg README.md
          git diff --cached --quiet || (git commit -m "Refresh ledger" && git push)
